# Render Blueprint for the backend (Singapore). Nothing secret lives here: values marked
# `sync: false` are typed into the Render dashboard, and JWT_SECRET is generated by Render.
# See docs/DEPLOYMENT.md for the full walkthrough.
services:
  - type: web
    name: kbg-backend
    runtime: python
    region: singapore
    plan: free # use "starter" for a real restaurant: the free plan sleeps after 15 idle minutes
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Apply any new database migrations, then start the API.
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync fastapi run app/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL # Neon pooled string (host contains -pooler)
        sync: false
      - key: DATABASE_URL_DIRECT # Neon direct string, used by migrations
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL # the Vercel URL, e.g. https://your-app.vercel.app (no trailing slash)
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: RATELIMIT_ENABLED
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: JWT_EXPIRE_DAYS
        value: "7"
      - key: FREE_DELIVERY_THRESHOLD
        value: "1500"
      - key: LOG_LEVEL
        value: info
